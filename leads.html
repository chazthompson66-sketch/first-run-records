<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Run — Acquisition Tracker</title><link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&family=Righteous&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'DM Sans';background:#f3efe7;color:#111}.top{background:#111;color:#fff;padding:28px 5vw}.top h1{font:34px Bungee;margin:0}.wrap{padding:28px 5vw}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;padding:18px;border-top:4px solid #e11b22}.stat b{font:28px Righteous;display:block}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.controls input,.controls select,.controls button{padding:11px;border:1px solid #bbb;background:#fff}.controls button{background:#e11b22;color:#fff;border:0;font-weight:700;cursor:pointer}.table{overflow:auto;background:#fff}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#111;color:#fff}.stage{font-weight:700}.note{font-size:12px;color:#666;margin-top:16px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><h1>FIRST RUN ACQUISITION TRACKER</h1><div>Prospect → Contacted → Interested → Quote → Won / Lost</div></header><main class="wrap"><div class="stats"><div class="stat"><b id="total">0</b>Prospects</div><div class="stat"><b id="contacted">0</b>Contacted</div><div class="stat"><b id="interested">0</b>Interested</div><div class="stat"><b id="quoted">0</b>Quotes</div><div class="stat"><b id="won">0</b>Won</div></div><div class="controls"><input id="name" placeholder="Artist / venue / promoter"><select id="type"><option>Artist</option><option>Venue</option><option>Promoter</option><option>Manager/Agent</option></select><input id="city" placeholder="City"><input id="contact" placeholder="Email / social / URL"><select id="source"><option>Direct research</option><option>Venue</option><option>Festival</option><option>Instagram</option><option>QR</option><option>Referral</option></select><button onclick="addLead()">ADD PROSPECT</button><button onclick="exportCSV()">EXPORT CSV</button></div><div class="table"><table><thead><tr><th>Name</th><th>Type</th><th>City</th><th>Contact</th><th>Source</th><th>Stage</th><th>Next action</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">This lightweight tracker stores entries in this browser. Export CSV regularly for the master prospect database.</p></main><script>let leads=JSON.parse(localStorage.getItem('frrLeads')||'[]');function save(){localStorage.setItem('frrLeads',JSON.stringify(leads));render()}function addLead(){let n=document.getElementById('name').value.trim();if(!n)return;leads.push({name:n,type:type.value,city:city.value,contact:contact.value,source:source.value,stage:'Prospect',next:'Research / personalise outreach',notes:''});document.getElementById('name').value='';save()}function render(){let r=document.getElementById('rows');r.innerHTML='';leads.forEach((l,i)=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${esc(l.name)}</td><td>${esc(l.type)}</td><td>${esc(l.city)}</td><td>${esc(l.contact)}</td><td>${esc(l.source)}</td><td><select onchange="leads[${i}].stage=this.value;save()"><option>Prospect</option><option>Contacted</option><option>Interested</option><option>Quote</option><option>Won</option><option>Lost</option></select></td><td contenteditable onblur="leads[${i}].next=this.innerText;save()">${esc(l.next)}</td><td contenteditable onblur="leads[${i}].notes=this.innerText;save()">${esc(l.notes)}</td><td><button onclick="leads.splice(${i},1);save()">×</button></td>`;r.appendChild(tr);tr.querySelector('select').value=l.stage});total.textContent=leads.length;contacted.textContent=leads.filter(x=>x.stage==='Contacted').length;interested.textContent=leads.filter(x=>x.stage==='Interested').length;quoted.textContent=leads.filter(x=>x.stage==='Quote').length;won.textContent=leads.filter(x=>x.stage==='Won').length}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function exportCSV(){let h=['Name','Type','City','Contact','Source','Stage','Next action','Notes'];let a=[h,...leads.map(x=>[x.name,x.type,x.city,x.contact,x.source,x.stage,x.next,x.notes])];let csv=a.map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),ael=document.createElement('a');ael.href=u;ael.download='first-run-prospects.csv';ael.click();URL.revokeObjectURL(u)}render();</script></body></html>
