<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acquisition Tracker | First Run Records</title><link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&family=Righteous&display=swap" rel="stylesheet"><style>:root{--r:#e11b22;--k:#111;--p:#f3efe7}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans';background:var(--p);color:#111}.head{background:#111;color:#fff;padding:28px 4vw;display:flex;justify-content:space-between;align-items:center}.head h1{font:30px Bungee;margin:0}.wrap{padding:30px 4vw}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#fff;padding:18px;border-top:5px solid var(--r)}.stat b{display:block;font:30px Righteous}.panel{background:#fff;margin-top:18px;padding:22px}.panel h2{font:25px Righteous;margin-top:0}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.form input,.form select{padding:10px;border:1px solid #ccc;width:100%}button{background:var(--r);color:#fff;border:0;padding:11px;font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filters button{background:#111}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{background:#111;color:#fff}.pill{font-weight:800}.actions button{padding:6px 8px;margin-right:4px}.note{font-size:12px;color:#666}.export{float:right}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}}</style></head><body><header class="head"><h1>FIRST RUN — ACQUISITION TRACKER</h1><a style="color:#fff" href="index.html">← SITE</a></header><main class="wrap"><div class="stats"><div class="stat"><span>PROSPECTS</span><b id="s0">0</b></div><div class="stat"><span>CONTACTED</span><b id="s1">0</b></div><div class="stat"><span>INTERESTED</span><b id="s2">0</b></div><div class="stat"><span>QUOTES</span><b id="s3">0</b></div><div class="stat"><span>WON</span><b id="s4">0</b></div></div><section class="panel"><h2>ADD LEAD / ENQUIRY</h2><div class="form"><input id="name" placeholder="Artist / venue / promoter"><select id="type"><option>Artist</option><option>Venue</option><option>Promoter</option><option>Festival</option><option>Enquiry</option></select><input id="city" placeholder="City / region"><select id="source"><option>Direct outreach</option><option>QR - venue</option><option>QR - tour</option><option>Instagram</option><option>Facebook</option><option>Festival</option><option>Promoter referral</option><option>Website organic</option><option>Other</option></select><select id="stage"><option>Prospect</option><option>Contacted</option><option>Interested</option><option>Quote</option><option>Won</option><option>Lost</option></select><button onclick="add()">ADD LEAD</button></div><p class="note">Stored in this browser. Export regularly to CSV for the master prospect database.</p></section><section class="panel"><button class="export" onclick="csv()">EXPORT CSV</button><h2>PIPELINE</h2><div class="filters"><button onclick="render('All')">ALL</button><button onclick="render('Prospect')">PROSPECTS</button><button onclick="render('Contacted')">CONTACTED</button><button onclick="render('Interested')">INTERESTED</button><button onclick="render('Quote')">QUOTES</button><button onclick="render('Won')">WON</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>Location</th><th>Source</th><th>Stage</th><th>Added</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const key='firstRunLeadsV1';let leads=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(leads));render()}function add(){let n=name.value.trim();if(!n)return;leads.unshift({name:n,type:type.value,city:city.value,source:source.value,stage:stage.value,date:new Date().toISOString().slice(0,10)});name.value='';city.value='';save()}function render(f='All'){let r=leads.filter(x=>f==='All'||x.stage===f);rows.innerHTML=r.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.type)}</td><td>${esc(x.city)}</td><td>${esc(x.source)}</td><td class="pill">${esc(x.stage)}</td><td>${x.date}</td><td class="actions"><button onclick="advance('${x.name.replaceAll("'","\\'")}')">NEXT</button><button onclick="del('${x.name.replaceAll("'","\\'")}')">×</button></td></tr>`).join('');['Prospect','Contacted','Interested','Quote','Won'].forEach((s,i)=>document.getElementById('s'+i).textContent=leads.filter(x=>x.stage===s).length)}function advance(n){let x=leads.find(a=>a.name===n),a=['Prospect','Contacted','Interested','Quote','Won'];if(x&&a.includes(x.stage)&&x.stage!=='Won')x.stage=a[a.indexOf(x.stage)+1];save()}function del(n){leads=leads.filter(x=>x.name!==n);save()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function csv(){let h=['Name','Type','Location','Source','Stage','Added'],q=v=>'"'+String(v||'').replaceAll('"','""')+'"',out=[h.join(','),...leads.map(x=>[x.name,x.type,x.city,x.source,x.stage,x.date].map(q).join(','))].join('\n'),b=new Blob([out],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='first-run-leads.csv';a.click();URL.revokeObjectURL(u)}render()</script></body></html>
